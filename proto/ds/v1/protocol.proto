syntax = "proto3";

package ds.v1;

option go_package = "demonslayer2d/internal/pb;pb";

// Names must also be valid in GDScript: the client generates code with
// godobuf. Do not name a field `message` or `class`, or a message `Error`.
// Renames keep field numbers, so the wire format is unchanged.
//
// Every WebSocket binary message carries exactly one Envelope.
// Requests use seq >= 1; the response reuses the same seq.
// Server-initiated messages use seq = 0.
message Envelope {
  uint32 seq = 1;
  oneof payload {
    ErrorResp error = 2;

    RegisterReq register_req = 10;
    RegisterResp register_resp = 11;
    LoginReq login_req = 12;
    LoginResp login_resp = 13;
    CharListReq char_list_req = 14;
    CharListResp char_list_resp = 15;
    CreateCharReq create_char_req = 16;
    CreateCharResp create_char_resp = 17;
    DeleteCharReq delete_char_req = 18;
    DeleteCharResp delete_char_resp = 19;
    EnterWorldReq enter_world_req = 20;
    EnterWorldResp enter_world_resp = 21;
    LeaveWorldReq leave_world_req = 22;
    LeaveWorldResp leave_world_resp = 23;

    MoveInput move_input = 30;
    EntityEnter entity_enter = 31;
    EntityLeave entity_leave = 32;
    WorldTick world_tick = 33;

    Ping ping = 40;
    Pong pong = 41;
    Kicked kicked = 42;

    AttackReq attack_req = 50;
    AttackResp attack_resp = 51;
    AllocatePointsReq allocate_points_req = 52;
    AllocatePointsResp allocate_points_resp = 53;
    RespawnReq respawn_req = 54;
    RespawnResp respawn_resp = 55;
    SelfStats self_stats = 56;

    LearnSkillReq learn_skill_req = 57;
    LearnSkillResp learn_skill_resp = 58;
    CastReq cast_req = 59;
    CastResp cast_resp = 60;

    PickupReq pickup_req = 61;
    PickupResp pickup_resp = 62;
    EquipReq equip_req = 63;
    EquipResp equip_resp = 64;
    UnequipReq unequip_req = 65;
    UnequipResp unequip_resp = 66;
    DiscardReq discard_req = 67;
    DiscardResp discard_resp = 68;
    SortBagReq sort_bag_req = 69;
    SortBagResp sort_bag_resp = 70;
    EnhanceReq enhance_req = 71;
    EnhanceResp enhance_resp = 72;
    PunchReq punch_req = 73;
    PunchResp punch_resp = 74;
    SocketReq socket_req = 75;
    SocketResp socket_resp = 76;
    UnsocketReq unsocket_req = 77;
    UnsocketResp unsocket_resp = 78;
    RefineReq refine_req = 79;
    RefineResp refine_resp = 80;
    RefineChooseReq refine_choose_req = 81;
    RefineChooseResp refine_choose_resp = 82;

    UsePortalReq use_portal_req = 83;
    ChangeZoneReq change_zone_req = 84;
    ZoneListReq zone_list_req = 85;
    ZoneListResp zone_list_resp = 86;

    BuyReq buy_req = 87;
    BuyResp buy_resp = 88;
    SellReq sell_req = 89;
    SellResp sell_resp = 90;
    UseItemReq use_item_req = 91;
    UseItemResp use_item_resp = 92;
    ReturnTownReq return_town_req = 93;
    TravelReq travel_req = 94;
    StashOpenReq stash_open_req = 95;
    StashOpenResp stash_open_resp = 96;
    StashDepositReq stash_deposit_req = 97;
    StashDepositResp stash_deposit_resp = 98;
    StashWithdrawReq stash_withdraw_req = 99;
    StashWithdrawResp stash_withdraw_resp = 100;
    StashExpandReq stash_expand_req = 101;
    StashExpandResp stash_expand_resp = 102;
    StashSortReq stash_sort_req = 103;
    StashSortResp stash_sort_resp = 104;
    SetPkReq set_pk_req = 105;
    SetPkResp set_pk_resp = 106;
    DeathNotice death_notice = 107;
    PartyInviteReq party_invite_req = 108;
    PartyInviteResp party_invite_resp = 109;
    PartyInvite party_invite = 110;
    PartyAnswerReq party_answer_req = 111;
    PartyAnswerResp party_answer_resp = 112;
    PartyLeaveReq party_leave_req = 113;
    PartyLeaveResp party_leave_resp = 114;
    PartyKickReq party_kick_req = 115;
    PartyKickResp party_kick_resp = 116;
    PartyState party_state = 117;
    PartyNotice party_notice = 118;
    QuestAcceptReq quest_accept_req = 119;
    QuestAcceptResp quest_accept_resp = 120;
    QuestTurnInReq quest_turn_in_req = 121;
    QuestTurnInResp quest_turn_in_resp = 122;
    QuestProgress quest_progress = 123;
  }
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_BAD_REQUEST = 1;
  ERROR_CODE_VERSION_MISMATCH = 2;
  ERROR_CODE_RATE_LIMITED = 3;
  ERROR_CODE_AUTH_FAILED = 4;
  ERROR_CODE_USERNAME_TAKEN = 5;
  ERROR_CODE_USERNAME_INVALID = 6;
  ERROR_CODE_PASSWORD_INVALID = 7;
  ERROR_CODE_NAME_TAKEN = 8;
  ERROR_CODE_NAME_INVALID = 9;
  ERROR_CODE_SLOT_OCCUPIED = 10;
  ERROR_CODE_CHAR_NOT_FOUND = 11;
  ERROR_CODE_NOT_IN_WORLD = 12;
  ERROR_CODE_ALREADY_IN_WORLD = 13;
  ERROR_CODE_ZONE_FULL = 14;
  ERROR_CODE_INTERNAL = 15;
  // The target does not exist, is dead, is the caster itself, is neither a
  // monster nor a player, or no player with that id is in the world.
  ERROR_CODE_INVALID_TARGET = 16;
  ERROR_CODE_OUT_OF_RANGE = 17;
  ERROR_CODE_ON_COOLDOWN = 18;
  // The attacker or the target stands in a safe zone.
  ERROR_CODE_IN_SAFE_ZONE = 19;
  // The action needs a living character.
  ERROR_CODE_DEAD = 20;
  // Respawn was requested while alive.
  ERROR_CODE_NOT_DEAD = 21;
  ERROR_CODE_NOT_ENOUGH_POINTS = 22;
  // The skill has not been learned yet.
  ERROR_CODE_SKILL_NOT_LEARNED = 23;
  // The character lacks the MP the skill costs.
  ERROR_CODE_NOT_ENOUGH_MP = 24;
  // The skill is already at its maximum level.
  ERROR_CODE_SKILL_MAXED = 25;
  // The character level is below the level the skill or item needs.
  ERROR_CODE_LEVEL_TOO_LOW = 26;
  // The bag has no room for the item.
  ERROR_CODE_BAG_FULL = 27;
  // No such item: an empty slot, or no ground item of the character's with that id.
  ERROR_CODE_ITEM_NOT_FOUND = 28;
  // The weapon belongs to another class.
  ERROR_CODE_WRONG_CLASS = 29;
  // The wallet holds less Xu than the action costs.
  ERROR_CODE_NOT_ENOUGH_XU = 30;
  // Missing enhancement stones, or a protection charm that was asked for.
  ERROR_CODE_NOT_ENOUGH_MATERIALS = 31;
  // The item is already at the highest enhancement level.
  ERROR_CODE_ENHANCE_MAXED = 32;
  // Unused since protocol 10: forging needs a nearby smith, not a safe zone.
  ERROR_CODE_NOT_IN_SAFE_ZONE = 33;
  // The item already has the most holes.
  ERROR_CODE_HOLES_MAXED = 34;
  // The gem's level is above the item's tier / 10.
  ERROR_CODE_GEM_TOO_HIGH = 35;
  // Only Vàng, Cam and Đỏ items can be refined.
  ERROR_CODE_NOT_REFINABLE = 36;
  // There is no refine result waiting for a choice.
  ERROR_CODE_NO_PENDING_REFINE = 37;
  // The current map has no running zone with that number.
  ERROR_CODE_ZONE_NOT_FOUND = 38;
  // The character is too far from the NPC.
  ERROR_CODE_NPC_TOO_FAR = 39;
  // The item cannot be sold to an NPC.
  ERROR_CODE_NOT_SELLABLE = 40;
  // The potion would restore nothing: HP or MP is already full.
  ERROR_CODE_ALREADY_FULL = 41;
  // The stash has no room for the item.
  ERROR_CODE_STASH_FULL = 42;
  // The stash is already at its largest size.
  ERROR_CODE_STASH_MAXED = 43;
  // The wallet holds too little Luong.
  ERROR_CODE_NOT_ENOUGH_LUONG = 44;
  // The target is a player the PK rules or the map type do not allow to
  // attack, or a party member.
  ERROR_CODE_PK_FORBIDDEN = 45;
  // PK cannot be turned off, nor the world left, yet: the character fought
  // a player recently.
  ERROR_CODE_IN_PVP_COMBAT = 46;
  // The party already has 5 members.
  ERROR_CODE_PARTY_FULL = 47;
  // The target already belongs to a party.
  ERROR_CODE_ALREADY_IN_PARTY = 48;
  // Only the party leader may do this.
  ERROR_CODE_NOT_PARTY_LEADER = 49;
  // The character is not in a party.
  ERROR_CODE_NOT_IN_PARTY = 50;
  // The invite is gone: expired, withdrawn or never sent.
  ERROR_CODE_INVITE_NOT_FOUND = 51;
  // The target already holds an invite from someone else.
  ERROR_CODE_INVITE_PENDING = 52;
  // The quest is taken, done, or the one before it in its chain is not done.
  ERROR_CODE_QUEST_NOT_AVAILABLE = 53;
  // The quest is not taken, or is already turned in.
  ERROR_CODE_QUEST_NOT_ACTIVE = 54;
  // The objective of the quest is not finished yet.
  ERROR_CODE_QUEST_NOT_COMPLETE = 55;
  // First learning of a skill needs its skill book in the bag.
  ERROR_CODE_NO_SKILL_BOOK = 56;
}

enum KickReason {
  KICK_REASON_UNSPECIFIED = 0;
  KICK_REASON_DUPLICATE_LOGIN = 1;
  KICK_REASON_SERVER_SHUTDOWN = 2;
  KICK_REASON_ZONE_RESTART = 3;
  KICK_REASON_RATE_LIMITED = 4;
  KICK_REASON_IDLE_TIMEOUT = 5;
  KICK_REASON_SLOW_CONSUMER = 6;
  KICK_REASON_PROTOCOL_ERROR = 7;
}

enum CharClass {
  CHAR_CLASS_UNSPECIFIED = 0;
  CHAR_CLASS_VIEM = 1;
  CHAR_CLASS_THUY = 2;
  CHAR_CLASS_MINH = 3;
  CHAR_CLASS_NHAM = 4;
  CHAR_CLASS_PHONG = 5;
}

enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_PLAYER = 1;
  ENTITY_KIND_MONSTER = 2;
  // An item on the ground, seen only by its owner.
  ENTITY_KIND_ITEM = 3;
}

message ErrorResp {
  ErrorCode code = 1;
  string detail = 2;
}

message RegisterReq {
  string username = 1;
  string password = 2;
}

message RegisterResp {}

message LoginReq {
  string username = 1;
  string password = 2;
  uint32 protocol_version = 3;
}

message LoginResp {
  int64 account_id = 1;
}

message CharSummary {
  int64 id = 1;
  int32 slot = 2;
  string name = 3;
  CharClass char_class = 4;
  int32 level = 5;
  string map_id = 6;
}

message CharListReq {}

message CharListResp {
  repeated CharSummary chars = 1;
}

message CreateCharReq {
  int32 slot = 1;
  string name = 2;
  CharClass char_class = 3;
}

message CreateCharResp {
  CharSummary char = 1;
}

message DeleteCharReq {
  int64 char_id = 1;
  string confirm_name = 2;
}

message DeleteCharResp {}

message EnterWorldReq {
  int64 char_id = 1;
}

// The reply to EnterWorldReq, and also to UsePortalReq and ChangeZoneReq: a
// transfer puts the character in a new zone exactly as entering the world does.
message EnterWorldResp {
  uint64 self_entity_id = 1;
  string map_id = 2;
  int32 zone = 3;
  float x = 4;
  float y = 5;
  uint32 server_tick = 6;
  // Tiles per second.
  float move_speed = 7;
  // Zone ticks per second; each tick moves move_speed / tick_rate tiles.
  uint32 tick_rate = 8;
  // The character's own stats at entry.
  SelfStats stats = 9;
  // Every skill the character has learned.
  repeated SkillLevel skills = 10;
  // The bag and the worn items.
  Inventory inventory = 11;
  // Cooldowns still running, sorted by key; empty when entering from the
  // character screen.
  repeated Cooldown cooldowns = 12;
  // Every quest entry of the character.
  QuestLog quests = 13;
  // Skills of this level or lower need no skill book to learn.
  int32 skill_book_waiver = 14;
}

// Time left on a cooldown when entering a zone. key: a skill id, "slash",
// "zone_change", "potion_hp", "potion_mp" or "pvp_combat".
message Cooldown {
  string key = 1;
  int32 remaining_ms = 2;
}

message LeaveWorldReq {}

message LeaveWorldResp {}

// Direction from a joystick or WASD; length is clamped to 1, (0,0) stops.
message MoveInput {
  uint32 input_seq = 1;
  float dir_x = 2;
  float dir_y = 3;
}

message EntityEnter {
  uint64 id = 1;
  EntityKind kind = 2;
  string name = 3;
  CharClass char_class = 4;
  int32 level = 5;
  float x = 6;
  float y = 7;
  float dir_x = 8;
  float dir_y = 9;
  int32 hp = 10;
  int32 max_hp = 11;
  // True for a corpse still visible in the zone.
  bool dead = 12;
  // Set for an ITEM entity; name is the item's name, level and HP are 0.
  ItemInfo item = 13;
  // A player's worn weapon enhancement (0 without a wearable weapon); clients
  // draw the glow from it.
  int32 weapon_enhance = 14;
  // True for a player with PK on.
  bool pk_on = 15;
}

message EntityLeave {
  uint64 id = 1;
}

message EntityMove {
  uint64 id = 1;
  float x = 2;
  float y = 3;
  float dir_x = 4;
  float dir_y = 5;
  // Client jumps to this position instead of interpolating.
  bool snap = 6;
}

// Sent every tick, even when moves is empty. Events only cover entities in
// the receiver's view. Clients apply them in this order: moves, casts, hits,
// deaths, hp_changes, level_ups, looks. Each HpChange is an entity's HP and max HP at
// the end of the tick, so it overrides any hp_after of the same tick.
message WorldTick {
  uint32 tick = 1;
  // Highest MoveInput.input_seq the server has applied for the receiver.
  uint32 ack_input_seq = 2;
  repeated EntityMove moves = 3;
  repeated Hit hits = 4;
  repeated Death deaths = 5;
  repeated HpChange hp_changes = 6;
  repeated LevelUp level_ups = 7;
  repeated Cast casts = 8;
  repeated LookChange looks = 9;
}

// A player's look changed; sent to everyone who sees the player and to the
// player. It carries the entity's whole look at the end of the tick, so a
// client applies every field.
message LookChange {
  uint64 id = 1;
  int32 weapon_enhance = 2;
  bool pk_on = 3;
}

message Ping {
  int64 client_time = 1;
}

message Pong {
  int64 client_time = 1;
  int64 server_time = 2;
}

message Kicked {
  KickReason reason = 1;
}

// Default slash at one target; the result arrives as a Hit in WorldTick.
message AttackReq {
  // A monster or a player.
  uint64 target_id = 1;
}

message AttackResp {}

// Spends free potential points; each field is the number of points to add.
message AllocatePointsReq {
  uint32 strength = 1;
  uint32 agility = 2;
  uint32 vitality = 3;
  uint32 intellect = 4;
}

message AllocatePointsResp {
  SelfStats stats = 1;
}

// Respawns the dead character. in_place spends 1 Luong to rise where it died;
// otherwise it returns to the map respawn point.
message RespawnReq {
  bool in_place = 1;
}

// Where the character stands after respawning.
message RespawnResp {
  float x = 1;
  float y = 2;
}

// The own character's progression and derived stats; pushed with seq = 0
// whenever they change.
message SelfStats {
  int32 level = 1;
  int64 exp = 2;
  // EXP needed to reach the next level.
  int64 exp_next = 3;
  int32 free_points = 4;
  int32 strength = 5;
  int32 agility = 6;
  int32 vitality = 7;
  int32 intellect = 8;
  int32 hp = 9;
  int32 max_hp = 10;
  int32 mp = 11;
  int32 max_mp = 12;
  int32 phys_attack = 13;
  int32 magic_attack = 14;
  int32 phys_defense = 15;
  int32 magic_defense = 16;
  int32 accuracy = 17;
  int32 evasion = 18;
  // Critical rate in basis points (100 = 1%).
  int32 crit_rate_bp = 19;
  // Unspent skill points.
  int32 skill_points = 20;
  // Xu in the wallet.
  int64 xu = 21;
  // HP regenerated per second from worn enhancement milestones, in basis
  // points of max HP (100 = 1%).
  int32 hp_regen_bp = 22;
  // MP regenerated per second from worn enhancement milestones.
  int32 mp_regen = 23;
  // Luong in the account wallet.
  int64 luong = 24;
  // True while PK is on.
  bool pk_on = 25;
}

message Hit {
  uint64 attacker_id = 1;
  uint64 target_id = 2;
  int32 damage = 3;
  int32 hp_after = 4;
  // True for a monster's ranged shot; the client draws a projectile, not a slash.
  bool ranged = 5;
  // The skill that dealt the hit; empty for the default slash or a monster hit.
  // Sent at the impact tick, not when the attack started.
  string skill_id = 6;
}

message Death {
  uint64 id = 1;
}

message HpChange {
  uint64 id = 1;
  int32 hp = 2;
  int32 max_hp = 3;
}

message LevelUp {
  uint64 id = 1;
  int32 level = 2;
}

// Learns a skill or raises it one level; spends one skill point.
message LearnSkillReq {
  string skill_id = 1;
}

message LearnSkillResp {
  SelfStats stats = 1;
  repeated SkillLevel skills = 2;
  // The bag slot of the skill book just used; empty when no book was used.
  InventoryUpdate update = 3;
}

// Casts a skill. target_id is the locked target (0 for none); dir is the
// facing for skills without a target.
message CastReq {
  string skill_id = 1;
  // A monster or a player; 0 for none.
  uint64 target_id = 2;
  float dir_x = 3;
  float dir_y = 4;
}

message CastResp {}

message SkillLevel {
  string skill_id = 1;
  int32 level = 2;
}

// An attack started: a skill, the default slash, or a monster's melee or shot. Sent to
// everyone who sees the attacker and to the attacker. Damage is not here: it arrives
// with the Hit at the impact tick.
message Cast {
  uint64 caster_id = 1; // a player or a monster
  string skill_id = 2;  // empty: a basic attack (slash, monster melee, monster shot)
  uint64 target_id = 3;
  float dir_x = 4;
  float dir_y = 5;
  int32 level = 6; // the skill level used, so clients draw the right reach
  int32 windup_ms = 7;
  repeated CastImpact impacts = 8; // empty when nothing is hit
  bool ranged = 9;                 // a monster's ranged shot
}

// One target the attack will land on. The Hit for it is sent at the impact tick.
message CastImpact {
  uint64 target_id = 1;
  int32 impact_ms = 2; // from the Cast tick to the impact: (impact tick - t0) * 1000 / tick rate
}

// An item in the bag, worn or on the ground.
message ItemInfo {
  string code = 1;
  int32 count = 2;       // 1 for equipment
  int32 quality = 3;     // 0 Trắng … 4 Đỏ
  CharClass element = 4; // UNSPECIFIED: no element
  int32 enhance = 5;
  repeated ItemLine lines = 6;
  repeated ItemLine hidden = 7;
  int32 holes = 8;
  // One entry per hole: a gem code, or "" for an empty hole.
  repeated string gems = 9;
}

message ItemLine {
  string stat = 1; // hp, phys_attack, magic_attack, phys_defense, magic_defense
  int32 value = 2;
}

// A bag slot (0..bag_size-1) or an equipment slot (0..9). No item: the slot is empty.
message ItemSlot {
  int32 slot = 1;
  ItemInfo item = 2;
}

message Inventory {
  int32 bag_size = 1;
  repeated ItemSlot bag = 2;      // occupied slots only
  repeated ItemSlot equipped = 3; // occupied slots only
}

// Slots that changed; an ItemSlot without an item is now empty.
message InventoryUpdate {
  repeated ItemSlot bag = 1;
  repeated ItemSlot equipped = 2;
}

// Picks up one of the character's ground items into the bag.
message PickupReq {
  uint64 item_id = 1;
}

message PickupResp {
  InventoryUpdate update = 1;
}

// Wears the piece in a bag slot, swapping with the worn one.
message EquipReq {
  int32 bag_slot = 1;
}

message EquipResp {
  InventoryUpdate update = 1;
  SelfStats stats = 2;
}

// Takes off a worn item into the first empty bag slot.
message UnequipReq {
  int32 equip_slot = 1;
}

message UnequipResp {
  InventoryUpdate update = 1;
  SelfStats stats = 2;
}

// Destroys count of the item in a bag slot; count 0 destroys the whole slot.
message DiscardReq {
  int32 bag_slot = 1;
  int32 count = 2;
}

message DiscardResp {
  InventoryUpdate update = 1;
}

// Merges stacks and sorts the bag.
message SortBagReq {}

// Every bag slot, empty ones without an item.
message SortBagResp {
  InventoryUpdate update = 1;
}

// An item in the bag (equipped = false) or worn.
message ItemRef {
  bool equipped = 1;
  int32 slot = 2;
}

// Enhances an equipment piece in a safe zone. The server tries up to times
// attempts (0 means 1) and stops at the first success, the first level drop
// or when the materials or Xu run out. protect spends one protection charm per
// attempt whose target level can drop.
message EnhanceReq {
  ItemRef item = 1;
  bool protect = 2;
  int32 times = 3;
}

// success is the outcome of the last attempt and level the item's level after
// it. update holds the item's slot and the bag slots materials were taken from;
// stats carries the new Xu.
message EnhanceResp {
  int32 attempts = 1;
  bool success = 2;
  int32 level = 3;
  InventoryUpdate update = 4;
  SelfStats stats = 5;
}

// Punches one more empty hole in an equipment piece in a safe zone.
message PunchReq {
  ItemRef item = 1;
}

// update holds the item's slot; stats carries the new Xu.
message PunchResp {
  InventoryUpdate update = 1;
  SelfStats stats = 2;
}

// Sockets the gem in bag slot gem_slot into the empty hole (0-based) of an
// equipment piece in a safe zone.
message SocketReq {
  ItemRef item = 1;
  int32 hole = 2;
  int32 gem_slot = 3;
}

// update holds the item's slot and the gem's bag slot.
message SocketResp {
  InventoryUpdate update = 1;
  SelfStats stats = 2;
}

// Takes the gem out of a hole (0-based) into the bag in a safe zone; the hole
// stays, empty.
message UnsocketReq {
  ItemRef item = 1;
  int32 hole = 2;
}

// update holds the item's slot and the bag slots the gem went to.
message UnsocketResp {
  InventoryUpdate update = 1;
  SelfStats stats = 2;
}

// Refines the sub-lines of a Vàng+ equipment piece in a safe zone, keeping the
// lines at the locked (0-based) indices. The result waits for a
// RefineChooseReq; any other item command but a pickup drops it.
message RefineReq {
  ItemRef item = 1;
  repeated int32 locked = 2;
}

// lines is the whole candidate set in order; the item keeps its lines until
// the choice. update holds the bag slots the stones came from.
message RefineResp {
  repeated ItemLine lines = 1;
  InventoryUpdate update = 2;
  SelfStats stats = 3;
}

// Takes the waiting refine result (accept) or keeps the old lines.
message RefineChooseReq {
  bool accept = 1;
}

// update holds the item's slot.
message RefineChooseResp {
  InventoryUpdate update = 1;
  SelfStats stats = 2;
}

// Sent by the client when the character walks into a portal. Accepted within
// 1 tile of the portal rectangle; the reply is an EnterWorldResp.
message UsePortalReq {
  string portal_id = 1;
}

// Moves the character to another running zone of the same map, keeping its
// position. The reply is an EnterWorldResp.
message ChangeZoneReq {
  int32 zone = 1;
}

message ZoneListReq {}

// The running zones of the current map, by zone number.
message ZoneListResp {
  repeated ZoneInfo zones = 1;
}

message ZoneInfo {
  int32 zone = 1;
  int32 players = 2;
  int32 capacity = 3;
}

// Buys count of an item from an NPC shop. Answered with BuyResp.
message BuyReq {
  string npc_id = 1;
  string code = 2;
  int32 count = 3;
  // A shop that needs no NPC, such as "luong" (then npc_id is empty).
  string shop_id = 4;
}

message BuyResp {
  InventoryUpdate update = 1;
  SelfStats stats = 2;
}

// Sells count of the stack in a bag slot to an NPC shop. Answered with SellResp.
message SellReq {
  string npc_id = 1;
  int32 bag_slot = 2;
  int32 count = 3;
}

message SellResp {
  InventoryUpdate update = 1;
  SelfStats stats = 2;
}

// Uses the potion in a bag slot. cooldown_ms is the wait before the next
// potion of the same group.
message UseItemReq {
  int32 bag_slot = 1;
}

message UseItemResp {
  InventoryUpdate update = 1;
  SelfStats stats = 2;
  int32 cooldown_ms = 3;
}

// Reads the return scroll in a bag slot. Answered with EnterWorldResp.
message ReturnTownReq {
  int32 bag_slot = 1;
}

// Rides the carriage NPC along one of its routes. Answered with EnterWorldResp.
message TravelReq {
  string npc_id = 1;
  int32 route = 2;
}

// The account stash: size slots, occupied ones listed.
message Stash {
  int32 size = 1;
  repeated ItemSlot items = 2;
}

// Opens the stash at a storage keeper NPC. Answered with StashOpenResp.
message StashOpenReq {
  string npc_id = 1;
}

message StashOpenResp {
  Stash stash = 1;
}

// Moves the item in a bag slot into the stash. Answered with StashDepositResp.
message StashDepositReq {
  string npc_id = 1;
  int32 bag_slot = 2;
}

// The changed bag slots and stash slots; an ItemSlot without an item is now empty.
message StashDepositResp {
  InventoryUpdate update = 1;
  repeated ItemSlot stash = 2;
}

// Moves the item in a stash slot into the bag. Answered with StashWithdrawResp.
message StashWithdrawReq {
  string npc_id = 1;
  int32 stash_slot = 2;
}

message StashWithdrawResp {
  InventoryUpdate update = 1;
  repeated ItemSlot stash = 2;
}

// Grows the stash by one step for Xu. Answered with StashExpandResp.
message StashExpandReq {
  string npc_id = 1;
}

message StashExpandResp {
  int32 size = 1;
  SelfStats stats = 2;
}

// Packs the stash. Answered with StashSortResp.
message StashSortReq {
  string npc_id = 1;
}

message StashSortResp {
  repeated ItemSlot stash = 1;
}

// Turns PK on or off; the answer is SetPkResp.
message SetPkReq {
  bool on = 1;
}

message SetPkResp {
  bool on = 1;
}

// Pushed with seq = 0 to the character that just died.
message DeathNotice {
  uint64 killer_id = 1;
  string killer_name = 2;
  // True when a player landed the killing blow.
  bool by_player = 3;
  // EXP taken as the PK penalty; 0 when none.
  int64 exp_lost = 4;
}

// One party member as every member sees it. id is the entity id, kept
// across zone changes.
message PartyMember {
  uint64 id = 1;
  string name = 2;
  CharClass char_class = 3;
  int32 level = 4;
  string map_id = 5;
  int32 zone = 6;
}

enum PartyNoticeKind {
  PARTY_NOTICE_KIND_UNSPECIFIED = 0;
  PARTY_NOTICE_KIND_JOINED = 1;          // name joined the party
  PARTY_NOTICE_KIND_LEFT = 2;            // name left the party
  PARTY_NOTICE_KIND_KICKED = 3;          // the leader removed name
  PARTY_NOTICE_KIND_YOU_WERE_KICKED = 4; // the leader removed you
  PARTY_NOTICE_KIND_DECLINED = 5;        // name declined your invite
  PARTY_NOTICE_KIND_DISBANDED = 6;       // you were the last member
  PARTY_NOTICE_KIND_NEW_LEADER = 7;      // name now leads the party
}

// Invites the player with target_id to the sender's party (created on the
// first accepted invite); the answer is PartyInviteResp.
message PartyInviteReq {
  uint64 target_id = 1;
}

message PartyInviteResp {}

// Pushed with seq = 0 to the invited player; expires_ms is the time left.
message PartyInvite {
  uint64 from_id = 1;
  string from_name = 2;
  int32 from_level = 3;
  CharClass from_class = 4;
  int32 expires_ms = 5;
}

// Accepts or declines the invite from from_id; the answer is PartyAnswerResp.
message PartyAnswerReq {
  uint64 from_id = 1;
  bool accept = 2;
}

message PartyAnswerResp {}

// Leaves the party; the answer is PartyLeaveResp.
message PartyLeaveReq {}

message PartyLeaveResp {}

// The leader removes member_id; the answer is PartyKickResp.
message PartyKickReq {
  uint64 member_id = 1;
}

message PartyKickResp {}

// Pushed with seq = 0 whenever the party changes. No members means the
// character is not in a party.
message PartyState {
  uint64 leader_id = 1;
  repeated PartyMember members = 2;
}

// Pushed with seq = 0 to tell a member what just happened.
message PartyNotice {
  PartyNoticeKind kind = 1;
  string name = 2;
}

// ---- Quests (protocol 14) ----

enum QuestState {
  QUEST_STATE_UNSPECIFIED = 0;
  QUEST_STATE_ACTIVE = 1; // accepted, objective counted in progress
  QUEST_STATE_DONE = 2;   // turned in
}

// One quest of the character. Quests without an entry are not taken.
message QuestEntry {
  string quest_id = 1;
  QuestState state = 2;
  int32 progress = 3;
}

// Every quest entry of the character.
message QuestLog {
  repeated QuestEntry quests = 1;
}

message QuestAcceptReq {
  string npc_id = 1;
  string quest_id = 2;
}

message QuestAcceptResp {
  QuestEntry quest = 1;
}

message QuestTurnInReq {
  string npc_id = 1;
  string quest_id = 2;
}

message QuestTurnInResp {
  string quest_id = 1;
  int64 exp = 2;
  int64 xu = 3;
  InventoryUpdate update = 4;
  SelfStats stats = 5;
}

// Pushed with seq 0 when objective progress changes; only the changed entries.
message QuestProgress {
  repeated QuestEntry quests = 1;
}
